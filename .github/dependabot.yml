# Version updates once a week; security updates arrive as soon as an advisory
# is published, whatever this schedule says. Patch and minor bumps come as
# one pull request per ecosystem, so a week's routine updates are one review.
# The GitHub Actions entry keeps the commit SHAs the workflows pin current,
# and the Docker entry the ClamAV engine the Security workflow scans with.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A version published less than a week ago is not proposed: a
    # compromised release is usually caught and pulled within days. Security
    # updates are not held back by this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Both track the oldest VS Code XLIDE supports (engines.vscode, ^1.95.0,
    # which runs on Node 20), not the newest: newer types would let the code
    # use APIs that version does not have. Move them with engines.vscode.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/vscode'
      # vitest 5 requires @types/node 22 or later, so it waits with the above.
      - dependency-name: 'vitest'
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /.github/clamav
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
