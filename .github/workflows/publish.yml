name: Publish

# A v*.*.* tag releases the extension. The Malware scan's Package job builds
# the vsix from the tagged commit and refuses a tag that does not match
# package.json's version; the scans run on that file; this workflow signs its
# build provenance and creates the GitHub release with the vsix, the signed
# bundle and both reports. The Marketplace upload is by hand, of the vsix on
# the release (see AGENTS.md). The Open VSX upload is the last job here, of
# that same vsix, once the owner has turned it on (see AGENTS.md).
#
# Started by hand, this is always a dry run: it builds, scans and assembles
# the release files exactly as a release would, and uploads them as the
# release-preview artifact instead of signing, releasing or uploading
# anything.

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml
    permissions:
      contents: read

  publish:
    name: Attest the vsix
    needs: [security, malware-scan]
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # sign the attestation
      attestations: write # store it
    steps:
      - name: Download the vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/

      # Signed build provenance: `gh attestation verify <file> --owner
      # WilliamSmithEdward` shows which commit and run built the vsix.
      - name: Attest the vsix
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: package/*.vsix

      # The signed bundle goes on the GitHub release too, so a download can be
      # checked offline: gh attestation verify <file> --bundle <bundle>.
      - name: Keep the provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  # On a dry run `publish` is skipped; this job still assembles the release
  # and uploads it as an artifact, and only the last step is skipped.
  github-release:
    name: Create GitHub release
    needs: [security, malware-scan, publish]
    if: >-
      ${{ !cancelled() && needs.security.result == 'success' && needs.malware-scan.result == 'success'
      && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release/

      - name: Download the security report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-report
          path: release/

      - name: Download the malware report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: malware-report
          path: release/

      - name: Download the provenance bundle
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance/

      - name: Name the bundle after the vsix
        if: env.DRY_RUN != 'true'
        run: |
          test "$(find provenance -type f | wc -l)" = 1
          version=$(jq -r .version package.json)
          mv provenance/* "release/xlide-$version.sigstore.json"

      - name: Extract the changelog section for this version
        run: |
          version=$(jq -r .version package.json)
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          ls -l release

      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: |
            release/
            release_notes.md
          if-no-files-found: error

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # The title is the tag and nothing else. The headline is in the body.
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: release/*
          fail_on_unmatched_files: true

  # Open VSX, where VSCodium, Gitpod, Theia and other VS Code builds install
  # from. It gets the vsix the GitHub release carries, not a second build.
  #
  # There is no stored token: Open VSX exchanges this run's OIDC token for a
  # short-lived publishing one (trusted publishing), which works only after
  # the owner has registered this repository and workflow file there. Until
  # the OPEN_VSX_PUBLISH repository variable is `true`, and on every dry run,
  # the job installs the tool and finds the vsix but uploads nothing.
  open-vsx:
    name: Publish to Open VSX
    needs: [github-release]
    # Its own condition: on a dry run `publish` is skipped, and a job without
    # one would be skipped along with it.
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    runs-on: ubuntu-24.04
    # Open VSX ties the trusted publisher to this environment as well as to
    # the repository and workflow file. The environment admits only `main`
    # (for the dry run) and `v*` tags, so a copy of this workflow on any other
    # branch cannot publish.
    environment: open-vsx
    permissions:
      contents: read
      id-token: write # the token Open VSX exchanges for a publishing one
    env:
      UPLOAD: >-
        ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
        && vars.OPEN_VSX_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No package cache, as in the Package job: a cache written by another
      # run must not reach a job that can publish.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false

      # ovsx and everything it depends on, at the versions and hashes in
      # package-lock.json. No install scripts run in a job that can publish.
      - name: Install ovsx from the lockfile
        run: |
          npm ci --ignore-scripts
          npx --no-install ovsx --version

      - name: Download the vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/

      - name: Find the vsix
        id: vsix
        run: |
          test "$(find package -type f -name '*.vsix' | wc -l)" = 1
          path=$(find package -type f -name '*.vsix')
          sha256sum "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Say why nothing is uploaded
        if: env.UPLOAD != 'true'
        run: echo "::notice::Not uploaded to Open VSX - this is a dry run, or the OPEN_VSX_PUBLISH variable is not 'true'."

      # --skip-duplicate lets a rerun pass once this version is already up.
      - name: Publish to Open VSX
        if: env.UPLOAD == 'true'
        env:
          VSIX: ${{ steps.vsix.outputs.path }}
        run: npx --no-install ovsx publish --packagePath "$VSIX" --trusted-publishing --skip-duplicate
