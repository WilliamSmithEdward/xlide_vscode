name: Security

# CodeQL, Semgrep and npm audit on every push and pull request to main, once a
# week, and on every release. Each gate fails on any finding: a new result is
# either fixed or recorded below with the reason it is not a vulnerability.
# On a release the three reports are attached to it as security-report.md
# with the raw SARIF beside it (see SECURITY.md). ClamAV and YARA-X run in
# the Malware scan workflow.
# zizmor audits the workflows themselves and keeps its own exceptions (see its job).

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - src/test
              - syntax_corpus
              - reference
              - out
              - dist
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif
      # Fails on any result not reviewed in .github/codeql/reviewed.json.
      - name: Fail on any unreviewed CodeQL result
        run: node .github/scripts/sarif-gate.mjs "CodeQL ${{ matrix.language }}" sarif .github/codeql/reviewed.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the scanner
        run: docker build --quiet --tag semgrep-scan .github/security/semgrep
      # Two rules are excluded because they fire on how the engine is built,
      # reviewed finding by finding on 2026-09-29:
      # - detect-non-literal-regexp: patterns are built from VBA identifiers
      #   the code has already parsed, and xlide_searchModules' regex mode is
      #   the tool's documented feature, as in VS Code's own search.
      # - path-join-resolve-traversal: paths are joined inside the user's own
      #   workspace, Office files and XLIDE's own state directory; the local
      #   API server never joins a request value into a path.
      - name: Scan
        run: >-
          docker run --rm --volume "$PWD:/src" --workdir /src semgrep-scan
          semgrep scan --metrics off --error --sarif --output semgrep.sarif
          --config p/default --config p/typescript --config p/github-actions
          --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
          --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal
          src scripts .github
      - name: Upload to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No package cache: this workflow runs on release (see malware-scan.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.2'
          package-manager-cache: false
      # Production and development dependencies both: the build and test
      # toolchain runs on the maintainer's machine and in CI.
      - name: Audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json').metadata.vulnerabilities; console.log(a); if (a.total) { console.error('npm audit reports ' + a.total + ' vulnerabilities'); process.exit(1); }"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: npm-audit
          path: npm-audit.json

  release-report:
    name: Attach release report
    # Started by hand, this is a dry run: the files it would attach stay on
    # the run as the release-preview artifact.
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    needs: [codeql, semgrep, dependencies]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: reports
      - name: Write the report
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          AUDIT_RESULT: ${{ needs.dependencies.result }}
          TAG: ${{ github.event.release.tag_name || 'dry run' }}
        run: node .github/scripts/security-report.mjs reports security-report.md
      - name: Bundle the SARIF
        run: (cd reports && zip -qr ../security-sarif.zip .)
      - name: Keep what the release would carry
        if: github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            security-report.md
            security-sarif.zip
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" security-report.md security-sarif.zip --clobber
      - name: Fail when a gate failed
        if: needs.codeql.result != 'success' || needs.semgrep.result != 'success' || needs.dependencies.result != 'success'
        run: exit 1

  # The one check branch protection requires: it passes only when every
  # check above did, so checks can be added or renamed without touching the
  # rules. The release report is not among them.
  # zizmor audits the workflows themselves: template injection, credential
  # persistence, over-broad permissions, dangerous triggers, and actions with
  # known advisories or impostor commits. Findings it should not raise are
  # turned off in .github/zizmor.yml or ignored inline, each with its reason;
  # anything else fails the job.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install zizmor
        run: python -m pip install --require-hashes -r .github/requirements/zizmor.txt

      # The token lets the online audits look up advisories and check that each
      # pinned SHA belongs to the action it names.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          zizmor --format plain .github/workflows || true
          exit "$status"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  security-passed:
    name: Security passed
    if: always()
    needs: [codeql, semgrep, dependencies, zizmor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every security job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
