name: CI

# Everything a run depends on is pinned: actions to commit SHAs, runners to an
# OS release, Node to 20.20.2 (the last Node 20, the runtime of the oldest VS
# Code XLIDE supports), and npm packages through the lockfile.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test

  # Non-ASCII text through the real engine for every supported code page
  # (the issue-#6 bug class): Thai, Japanese, Chinese (both), Korean,
  # Cyrillic, Greek, Turkish, Hebrew, Arabic, Vietnamese, and friends, plus
  # a full-ICU guard that fails loudly if TextDecoder would silently
  # degrade to cp1252. Runs on Windows too because that is where XLIDE
  # actually runs in production.
  languages:
    name: VBA language tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Storage and text conversion, then the editor-facing surfaces one layer
      # out: word selection, navigation, completion and structure on names that
      # are not Latin. Each of those has been a separate user-visible bug.
      - name: Run the VBA language tests
        run: >
          npx vitest run
          tests/vbaLanguageMatrix.test.ts
          tests/vbaCodePages.test.ts
          tests/moduleExport.test.ts
          tests/vbaCombiningMarks.test.ts
          tests/vbaNonAsciiNavigation.test.ts

  # Reading and writing the VBA project of an Access database: the Jet/ACE
  # storage engine underneath it (data pages, usage maps, long values, B-tree
  # keys, the collation table) and the module operations on top (source,
  # add, rename, delete), including names and source outside the project's
  # code page. Runs on Windows too because that is where XLIDE actually runs,
  # and the fixtures are the databases Access itself wrote.
  access:
    name: Access storage tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the Access storage tests
        run: >
          npx vitest run
          tests/accessStorage.test.ts
          tests/accessStorageEngine.test.ts
          tests/accessVbaWrite.test.ts
          tests/accessDesign.test.ts

  # The one check branch protection requires: it passes only when every job
  # above did, so jobs can be added or renamed without touching the rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build, languages, access]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
