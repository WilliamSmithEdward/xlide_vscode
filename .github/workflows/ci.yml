name: CI

# Everything a run depends on is pinned: actions to commit SHAs, runners to an
# OS release, tooling Node to 24.22.0 LTS, and npm packages through the
# lockfile. The build matrix also checks Node 20 for the oldest supported
# VS Code; extension API types and bundle targets still track that runtime.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.0', '20.20.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test

  # Non-ASCII text through the real engine for every supported code page
  # (the issue-#6 bug class): Thai, Japanese, Chinese (both), Korean,
  # Cyrillic, Greek, Turkish, Hebrew, Arabic, Vietnamese, and friends, plus
  # a full-ICU guard that fails loudly if TextDecoder would silently
  # degrade to cp1252. Runs on Windows too because that is where XLIDE
  # actually runs in production.
  languages:
    name: VBA language tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Storage and text conversion, then the editor-facing surfaces one layer
      # out: word selection, navigation, completion and structure on names that
      # are not Latin. Each of those has been a separate user-visible bug.
      - name: Run the VBA language tests
        run: >
          npx vitest run
          tests/language/vbaLanguageMatrix.test.ts
          tests/language/vbaCodePages.test.ts
          tests/moduleSync/moduleExport.test.ts
          tests/language/vbaCombiningMarks.test.ts
          tests/providers/vbaNonAsciiNavigation.test.ts

  # Reading and writing the VBA project of an Access database: the Jet/ACE
  # storage engine underneath it (data pages, usage maps, long values, B-tree
  # keys, the collation table) and the module operations on top (source,
  # add, rename, delete), including names and source outside the project's
  # code page. Runs on Windows too because that is where XLIDE actually runs,
  # and the fixtures are the databases Access itself wrote.
  access:
    name: Access storage tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the Access storage tests
        run: >
          npx vitest run
          tests/access/accessStorage.test.ts
          tests/access/accessStorageEngine.test.ts
          tests/access/accessVbaWrite.test.ts
          tests/access/accessDesign.test.ts

  # Execute generated recovery PowerShell against fake registry objects. No
  # Office installation or real registry changes are needed.
  oracle-windows:
    name: Oracle recovery tests (windows-2025)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute oracle recovery and lifecycle regressions
        run: >
          npx --no-install vitest run
          tests/vbeOracleSoundRecovery.test.ts
          tests/vbeOracleDialogSounds.test.ts
          tests/vbeOracleWorker.test.ts
          tests/vbeOracleStartup.test.ts
          tests/vbeOracleKnownCrash.test.ts

  # The one check branch protection requires: it passes only when every job
  # above did, so jobs can be added or renamed without touching the rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build, languages, access, oracle-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
