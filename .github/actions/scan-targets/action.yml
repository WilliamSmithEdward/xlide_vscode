name: Scan targets
description: >-
  Lists in scan-list.txt the files the ClamAV and YARA-X jobs scan: every
  tracked file, every dependency npm installs from the lockfile, and the
  package from the package job, as the vsix and unpacked. Last comes the
  canary each scan must detect, scan-canary/eicar.com.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.20.2'
        cache: npm
    # No install script runs, so nothing the scan looks at has executed.
    - name: Install the dependencies
      shell: bash
      run: npm ci --ignore-scripts
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package
        path: package
    - name: List the files
      shell: bash
      run: |
        unzip -q package/*.vsix -d package/contents
        mkdir -p scan-canary
        node .github/scripts/scan-sarif.mjs canary scan-canary/eicar.com
        {
          git -c core.quotepath=false ls-files
          find node_modules package -type f
          echo scan-canary/eicar.com
        } > scan-list.txt
        echo "$(wc -l < scan-list.txt) files to scan"
